# render.yaml — place in backend/ root
# Defines the PocketBase backend service on Render

services:
  - type: web
    name: nurabahar-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free

    # Render assigns PORT automatically — Dockerfile reads it
    envVars:
      - key: PORT
        value: 8090

    # Persistent disk so pb_data survives redeploys
    disk:
      name: pb-data
      mountPath: /pb_data
      sizeGB: 1